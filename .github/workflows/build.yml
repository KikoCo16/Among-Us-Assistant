name: Build Among Us Assistant APK

on:
  push:
    paths:
      - "AmongUs-Assistant.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project ZIP
        run: |
          test -f AmongUs-Assistant.zip
          mkdir -p android-project
          unzip -o AmongUs-Assistant.zip -d android-project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android-project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmongUs-Assistant-debug
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
