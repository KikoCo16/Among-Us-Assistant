name: Build AmongUs Assistant APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Vérifier et extraire le ZIP
        shell: bash
        run: |
          set -e

          echo "Recherche de AmongUs-Assistant.zip..."

          if [ ! -f "AmongUs-Assistant.zip" ]; then
            echo "ERREUR : AmongUs-Assistant.zip est introuvable à la racine du dépôt."
            ls -lah
            exit 1
          fi

          echo "Vérification de l'archive..."
          unzip -t AmongUs-Assistant.zip

          mkdir -p android-project
          unzip -q AmongUs-Assistant.zip -d android-project

          echo "Contenu extrait :"
          find android-project -maxdepth 4 -type f | head -100

      - name: Détecter automatiquement le dossier Android
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find android-project \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERREUR : Aucun fichier settings.gradle trouvé."
            find android-project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Projet Android détecté : $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERREUR : Le dossier app ne contient aucun build.gradle."
            find "$PROJECT_DIR" -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'application
        shell: bash
        run: |
          set -e

          echo "Compilation depuis : $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle --no-daemon assembleDebug

      - name: Vérifier la présence de l'APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERREUR : L'APK n'a pas été généré."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK généré avec succès :"
          ls -lh "$APK"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: AmongUs-Assistant-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
